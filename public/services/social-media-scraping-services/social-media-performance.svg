<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0618"/>
      <stop offset="100%" stop-color="#1a0e3a"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1240" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#150d30" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)"/>
  <!-- Ambient -->
  <ellipse cx="400" cy="260" rx="300" ry="200" fill="#7c3aed" fill-opacity="0.05"/>
  <ellipse cx="700" cy="100" rx="150" ry="100" fill="#06b6d4" fill-opacity="0.06"/>

  <!-- Main dashboard card -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="720" height="440" rx="18" fill="url(#cardBg)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Dashboard header -->
  <text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="white">Content Performance Dashboard</text>
  <text x="70" y="96" font-family="Inter,Arial,sans-serif" font-size="11" fill="#a78bfa">Last 7 days  •  Real-time scraping</text>
  <!-- Live indicator -->
  <circle cx="680" cy="72" r="5" fill="#10b981" filter="url(#glow)"/>
  <text x="692" y="76" font-family="Inter,Arial,sans-serif" font-size="11" fill="#10b981" font-weight="600">LIVE</text>

  <line x1="60" y1="108" x2="740" y2="108" stroke="#7c3aed" stroke-width="0.5" opacity="0.5"/>

  <!-- Top KPI cards row -->
  <!-- Card: Total Reach -->
  <rect x="65" y="118" width="155" height="74" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.5"/>
  <text x="83" y="140" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa" font-weight="600">TOTAL REACH</text>
  <text x="83" y="165" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">24.6M</text>
  <text x="83" y="181" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981">▲ 12.4%</text>

  <!-- Card: Viral Posts -->
  <rect x="235" y="118" width="155" height="74" rx="12" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="253" y="140" font-family="Inter,Arial,sans-serif" font-size="9" fill="#06b6d4" font-weight="600">VIRAL POSTS</text>
  <text x="253" y="165" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">384</text>
  <text x="253" y="181" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981">▲ 8 new today</text>

  <!-- Card: Avg Engagement -->
  <rect x="405" y="118" width="155" height="74" rx="12" fill="#1e1b4b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="423" y="140" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981" font-weight="600">AVG ENGAGEMENT</text>
  <text x="423" y="165" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">9.2%</text>
  <text x="423" y="181" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981">▲ 1.7% vs last week</text>

  <!-- Card: Data Points -->
  <rect x="575" y="118" width="155" height="74" rx="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
  <text x="593" y="140" font-family="Inter,Arial,sans-serif" font-size="9" fill="#f59e0b" font-weight="600">DATA POINTS</text>
  <text x="593" y="165" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">4.8B</text>
  <text x="593" y="181" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa">scraped this month</text>

  <!-- Main bar chart area -->
  <!-- Chart title -->
  <text x="70" y="218" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">Engagement by Platform  (Millions of interactions)</text>

  <!-- Y axis -->
  <line x1="105" y1="230" x2="105" y2="390" stroke="#374151" stroke-width="1"/>
  <!-- X axis -->
  <line x1="105" y1="390" x2="740" y2="390" stroke="#374151" stroke-width="1"/>
  <!-- Y labels -->
  <text x="70" y="233" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6b7280">50M</text>
  <text x="70" y="273" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6b7280">40M</text>
  <text x="70" y="313" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6b7280">30M</text>
  <text x="70" y="353" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6b7280">20M</text>
  <text x="70" y="393" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6b7280">0</text>
  <!-- Y grid lines -->
  <line x1="105" y1="230" x2="740" y2="230" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="105" y1="270" x2="740" y2="270" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="105" y1="310" x2="740" y2="310" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="105" y1="350" x2="740" y2="350" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Bar groups: Likes / Comments / Shares -->
  <!-- Instagram group -->
  <rect x="130" y="250" width="30" height="140" rx="4" fill="url(#barGrad1)" filter="url(#glow)"/>
  <rect x="164" y="300" width="30" height="90" rx="4" fill="url(#barGrad2)"/>
  <rect x="198" y="340" width="30" height="50" rx="4" fill="url(#barGrad3)"/>
  <text x="172" y="406" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Instagram</text>

  <!-- TikTok group -->
  <rect x="265" y="240" width="30" height="150" rx="4" fill="url(#barGrad1)" filter="url(#glow)"/>
  <rect x="299" y="290" width="30" height="100" rx="4" fill="url(#barGrad2)"/>
  <rect x="333" y="330" width="30" height="60" rx="4" fill="url(#barGrad3)"/>
  <text x="307" y="406" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">TikTok</text>

  <!-- Facebook group -->
  <rect x="400" y="280" width="30" height="110" rx="4" fill="url(#barGrad1)"/>
  <rect x="434" y="320" width="30" height="70" rx="4" fill="url(#barGrad2)"/>
  <rect x="468" y="355" width="30" height="35" rx="4" fill="url(#barGrad3)"/>
  <text x="442" y="406" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Facebook</text>

  <!-- Twitter group -->
  <rect x="535" y="295" width="30" height="95" rx="4" fill="url(#barGrad1)"/>
  <rect x="569" y="330" width="30" height="60" rx="4" fill="url(#barGrad2)"/>
  <rect x="603" y="360" width="30" height="30" rx="4" fill="url(#barGrad3)"/>
  <text x="577" y="406" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Twitter / X</text>

  <!-- LinkedIn group -->
  <rect x="670" y="310" width="30" height="80" rx="4" fill="url(#barGrad1)"/>
  <rect x="704" y="345" width="30" height="45" rx="4" fill="url(#barGrad2)"/>
  <text x="712" y="406" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">LinkedIn</text>

  <!-- Legend -->
  <rect x="200" y="420" width="10" height="10" rx="2" fill="#8b5cf6"/>
  <text x="215" y="430" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">Likes</text>
  <rect x="270" y="420" width="10" height="10" rx="2" fill="#06b6d4"/>
  <text x="285" y="430" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">Comments</text>
  <rect x="360" y="420" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="375" y="430" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">Shares</text>

  <!-- Trend line overlay -->
  <polyline points="145,258 280,248 415,288 550,303 685,318" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3" opacity="0.8"/>
  <!-- Trend dots -->
  <circle cx="145" cy="258" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="280" cy="248" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="415" cy="288" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="550" cy="303" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="685" cy="318" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <text x="440" y="415" font-family="Inter,Arial,sans-serif" font-size="9" fill="#f59e0b" opacity="0.8">─ ─ Trend</text>
</svg>
