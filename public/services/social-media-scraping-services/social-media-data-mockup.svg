<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f7ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rowHover" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7c3aed" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Background decoration -->
  <circle cx="720" cy="80" r="120" fill="#7c3aed" fill-opacity="0.06"/>
  <circle cx="100" cy="520" r="100" fill="#4f46e5" fill-opacity="0.06"/>

  <!-- Main data table card -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="680" height="480" rx="20" fill="white" stroke="#ede9fe" stroke-width="1.5"/>
  </g>

  <!-- Card header with gradient -->
  <rect x="60" y="60" width="680" height="58" rx="20" fill="url(#headerGrad)"/>
  <rect x="60" y="88" width="680" height="30" fill="url(#headerGrad)"/>

  <!-- Header text and icon -->
  <text x="94" y="93" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Social Media Data Schema</text>
  <!-- Table header cols -->
  <text x="94" y="131" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">FIELD</text>
  <text x="290" y="131" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">TYPE</text>
  <text x="390" y="131" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">EXAMPLE VALUE</text>
  <text x="620" y="131" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#6b7280">SOURCE</text>
  <line x1="80" y1="138" x2="720" y2="138" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 1 - highlighted -->
  <rect x="62" y="139" width="676" height="40" fill="url(#rowHover)" rx="0"/>
  <text x="94" y="163" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">post_id</text>
  <rect x="282" y="150" width="68" height="20" rx="10" fill="#ede9fe"/>
  <text x="300" y="164" font-family="Inter,Arial,sans-serif" font-size="10" fill="#7c3aed" font-weight="600">string</text>
  <text x="390" y="163" font-family="monospace,Arial" font-size="11" fill="#374151">"9x2kLmP38..."</text>
  <text x="620" y="163" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">All platforms</text>

  <!-- Row 2 -->
  <line x1="80" y1="179" x2="720" y2="179" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="203" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">likes_count</text>
  <rect x="282" y="190" width="60" height="20" rx="10" fill="#d1fae5"/>
  <text x="298" y="204" font-family="Inter,Arial,sans-serif" font-size="10" fill="#059669" font-weight="600">integer</text>
  <text x="390" y="203" font-family="monospace,Arial" font-size="11" fill="#374151">142,389</text>
  <text x="620" y="203" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Instagram, FB, TikTok</text>

  <!-- Row 3 - highlighted -->
  <rect x="62" y="219" width="676" height="40" fill="#fafafa" rx="0"/>
  <line x1="80" y1="219" x2="720" y2="219" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="243" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">comments_count</text>
  <rect x="282" y="230" width="60" height="20" rx="10" fill="#d1fae5"/>
  <text x="298" y="244" font-family="Inter,Arial,sans-serif" font-size="10" fill="#059669" font-weight="600">integer</text>
  <text x="390" y="243" font-family="monospace,Arial" font-size="11" fill="#374151">8,241</text>
  <text x="620" y="243" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">All platforms</text>

  <!-- Row 4 -->
  <line x1="80" y1="259" x2="720" y2="259" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="283" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">hashtags</text>
  <rect x="282" y="270" width="56" height="20" rx="10" fill="#fee2e2"/>
  <text x="295" y="284" font-family="Inter,Arial,sans-serif" font-size="10" fill="#dc2626" font-weight="600">array</text>
  <text x="390" y="283" font-family="monospace,Arial" font-size="11" fill="#374151">["#brand","#trend"]</text>
  <text x="620" y="283" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Twitter, Instagram</text>

  <!-- Row 5 - highlighted -->
  <rect x="62" y="299" width="676" height="40" fill="#fafafa" rx="0"/>
  <line x1="80" y1="299" x2="720" y2="299" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="323" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">sentiment_score</text>
  <rect x="282" y="310" width="52" height="20" rx="10" fill="#fef3c7"/>
  <text x="293" y="324" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d97706" font-weight="600">float</text>
  <text x="390" y="323" font-family="monospace,Arial" font-size="11" fill="#374151">0.82 (positive)</text>
  <text x="620" y="323" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">NLP-processed</text>

  <!-- Row 6 -->
  <line x1="80" y1="339" x2="720" y2="339" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="363" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">engagement_rate</text>
  <rect x="282" y="350" width="52" height="20" rx="10" fill="#fef3c7"/>
  <text x="293" y="364" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d97706" font-weight="600">float</text>
  <text x="390" y="363" font-family="monospace,Arial" font-size="11" fill="#374151">6.38%</text>
  <text x="620" y="363" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Calculated</text>

  <!-- Row 7 - highlighted -->
  <rect x="62" y="379" width="676" height="40" fill="#fafafa" rx="0"/>
  <line x1="80" y1="379" x2="720" y2="379" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="403" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">published_at</text>
  <rect x="282" y="390" width="70" height="20" rx="10" fill="#e0e7ff"/>
  <text x="295" y="404" font-family="Inter,Arial,sans-serif" font-size="10" fill="#4f46e5" font-weight="600">timestamp</text>
  <text x="390" y="403" font-family="monospace,Arial" font-size="11" fill="#374151">2025-09-24 14:23 UTC</text>
  <text x="620" y="403" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">All platforms</text>

  <!-- Row 8 -->
  <line x1="80" y1="419" x2="720" y2="419" stroke="#f3f4f6" stroke-width="1"/>
  <text x="94" y="443" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">follower_count</text>
  <rect x="282" y="430" width="60" height="20" rx="10" fill="#d1fae5"/>
  <text x="298" y="444" font-family="Inter,Arial,sans-serif" font-size="10" fill="#059669" font-weight="600">integer</text>
  <text x="390" y="443" font-family="monospace,Arial" font-size="11" fill="#374151">2,183,400</text>
  <text x="620" y="443" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">LinkedIn, Twitter</text>

  <!-- Row 9 -->
  <line x1="80" y1="459" x2="720" y2="459" stroke="#f3f4f6" stroke-width="1"/>
  <rect x="62" y="459" width="676" height="40" fill="url(#rowHover)" rx="0"/>
  <text x="94" y="483" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#1e1b4b">media_type</text>
  <rect x="282" y="470" width="56" height="20" rx="10" fill="#ede9fe"/>
  <text x="295" y="484" font-family="Inter,Arial,sans-serif" font-size="10" fill="#7c3aed" font-weight="600">enum</text>
  <text x="390" y="483" font-family="monospace,Arial" font-size="11" fill="#374151">"reel" | "image" | "story"</text>
  <text x="620" y="483" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">TikTok, Instagram</text>

  <!-- Footer bar -->
  <rect x="60" y="500" width="680" height="40" rx="20" fill="#fafafa" stroke="#ede9fe" stroke-width="1"/>
  <rect x="60" y="500" width="680" height="20" fill="#fafafa"/>
  <text x="94" y="524" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">50+ social data fields  •  6 major platforms  •  Normalized JSON/CSV output</text>
  <!-- Dots -->
  <circle cx="690" cy="520" r="5" fill="#10b981"/>
  <text x="700" y="524" font-family="Inter,Arial,sans-serif" font-size="10" fill="#10b981" font-weight="600">Live</text>

  <!-- Right side column decorations -->
  <rect x="710" y="150" width="4" height="110" rx="2" fill="#7c3aed" fill-opacity="0.15"/>
  <rect x="710" y="270" width="4" height="50" rx="2" fill="#10b981" fill-opacity="0.3"/>
  <rect x="710" y="330" width="4" height="60" rx="2" fill="#f59e0b" fill-opacity="0.3"/>
  <rect x="710" y="400" width="4" height="95" rx="2" fill="#4f46e5" fill-opacity="0.2"/>
</svg>
