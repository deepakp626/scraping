<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="url(#bgGrad)"/>

  <!-- Ambient blobs -->
  <ellipse cx="200" cy="150" rx="200" ry="150" fill="#7c3aed" fill-opacity="0.08"/>
  <ellipse cx="750" cy="420" rx="220" ry="160" fill="#4f46e5" fill-opacity="0.1"/>
  <ellipse cx="600" cy="100" rx="150" ry="120" fill="#06b6d4" fill-opacity="0.07"/>

  <!-- Grid dots -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="1.5" fill="#a78bfa"/>
    <circle cx="100" cy="50" r="1.5" fill="#a78bfa"/>
    <circle cx="150" cy="50" r="1.5" fill="#a78bfa"/>
    <circle cx="200" cy="50" r="1.5" fill="#a78bfa"/>
    <circle cx="50" cy="100" r="1.5" fill="#a78bfa"/>
    <circle cx="100" cy="100" r="1.5" fill="#a78bfa"/>
    <circle cx="150" cy="100" r="1.5" fill="#a78bfa"/>
    <circle cx="200" cy="100" r="1.5" fill="#a78bfa"/>
    <circle cx="700" cy="450" r="1.5" fill="#a78bfa"/>
    <circle cx="750" cy="450" r="1.5" fill="#a78bfa"/>
    <circle cx="800" cy="450" r="1.5" fill="#a78bfa"/>
    <circle cx="850" cy="450" r="1.5" fill="#a78bfa"/>
    <circle cx="700" cy="500" r="1.5" fill="#a78bfa"/>
    <circle cx="750" cy="500" r="1.5" fill="#a78bfa"/>
    <circle cx="800" cy="500" r="1.5" fill="#a78bfa"/>
    <circle cx="850" cy="500" r="1.5" fill="#a78bfa"/>
  </g>

  <!-- Connection lines between nodes -->
  <line x1="180" y1="200" x2="450" y2="280" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="720" y1="180" x2="450" y2="280" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="420" x2="450" y2="280" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="630" y1="400" x2="450" y2="280" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="120" y1="350" x2="300" y2="420" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="780" y1="350" x2="630" y2="400" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  <line x1="180" y1="200" x2="120" y2="350" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
  <line x1="720" y1="180" x2="780" y2="350" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="100" x2="450" y2="280" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="100" x2="720" y2="180" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="100" x2="180" y2="200" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>

  <!-- Node glows -->
  <ellipse cx="450" cy="280" rx="80" ry="80" fill="url(#nodeGlow1)"/>
  <ellipse cx="180" cy="200" rx="50" ry="50" fill="url(#nodeGlow2)"/>
  <ellipse cx="720" cy="180" rx="50" ry="50" fill="url(#nodeGlow3)"/>
  <ellipse cx="300" cy="420" rx="40" ry="40" fill="url(#nodeGlow2)"/>
  <ellipse cx="630" cy="400" rx="40" ry="40" fill="url(#nodeGlow1)"/>

  <!-- Central hub node -->
  <circle cx="450" cy="280" r="52" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <circle cx="450" cy="280" r="44" fill="#2d2060" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Central analytics icon (abstract chart) -->
  <rect x="428" y="270" width="8" height="20" rx="2" fill="#a78bfa"/>
  <rect x="441" y="260" width="8" height="30" rx="2" fill="#8b5cf6"/>
  <rect x="454" y="265" width="8" height="25" rx="2" fill="#c4b5fd"/>
  <rect x="467" y="275" width="8" height="15" rx="2" fill="#7c3aed"/>
  <!-- Trend line over bars -->
  <polyline points="432,268 445,258 458,263 471,273" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer ring -->
  <circle cx="450" cy="280" r="60" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="4 6" fill="none" opacity="0.5"/>
  <circle cx="450" cy="280" r="72" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="2 8" fill="none" opacity="0.3"/>

  <!-- Satellite nodes -->
  <!-- Node 1 - Facebook-ish (top left) -->
  <circle cx="180" cy="200" r="34" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
  <circle cx="180" cy="200" r="26" fill="#162040"/>
  <!-- Abstract F shape -->
  <rect x="172" y="188" width="4" height="24" rx="1" fill="#06b6d4"/>
  <rect x="172" y="188" width="12" height="4" rx="1" fill="#06b6d4"/>
  <rect x="172" y="198" width="9" height="3" rx="1" fill="#06b6d4"/>

  <!-- Node 2 - Instagram-ish (top right) -->
  <circle cx="720" cy="180" r="34" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
  <circle cx="720" cy="180" r="26" fill="#2d1030"/>
  <!-- Abstract camera icon -->
  <rect x="708" y="172" width="24" height="18" rx="4" fill="none" stroke="#ec4899" stroke-width="2"/>
  <circle cx="720" cy="181" r="5" fill="none" stroke="#ec4899" stroke-width="2"/>
  <circle cx="729" cy="173" r="2" fill="#ec4899"/>

  <!-- Node 3 - Twitter/X-ish (bottom left) -->
  <circle cx="300" cy="420" r="30" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <circle cx="300" cy="420" r="22" fill="#0c2030"/>
  <!-- X shape -->
  <line x1="291" y1="411" x2="309" y2="429" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="309" y1="411" x2="291" y2="429" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Node 4 - TikTok-ish (bottom right) -->
  <circle cx="630" cy="400" r="30" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
  <circle cx="630" cy="400" r="22" fill="#160c30"/>
  <!-- Abstract music note -->
  <rect x="626" y="390" width="8" height="16" rx="2" fill="#a78bfa"/>
  <path d="M634 390 Q642 387 642 394" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="625" cy="406" r="4" fill="#a78bfa"/>
  <circle cx="641" cy="403" r="4" fill="#06b6d4"/>

  <!-- Node 5 - top center -->
  <circle cx="500" cy="100" r="24" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="500" cy="100" r="17" fill="#1a1200"/>
  <!-- LinkedIn-ish icon (abstract squares) -->
  <rect x="491" y="91" width="7" height="7" rx="1" fill="#f59e0b"/>
  <rect x="491" y="101" width="7" height="7" rx="1" fill="#f59e0b"/>
  <rect x="501" y="91" width="7" height="7" rx="1" fill="#f59e0b"/>
  <rect x="501" y="101" width="7" height="7" rx="1" fill="#f59e0b"/>

  <!-- Node 6 small - left -->
  <circle cx="120" cy="350" r="18" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="120" cy="350" r="12" fill="#051a12"/>
  <!-- Play icon -->
  <polygon points="116,345 116,355 126,350" fill="#10b981"/>

  <!-- Node 7 small - right -->
  <circle cx="780" cy="350" r="18" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="780" cy="350" r="12" fill="#200816"/>
  <!-- Abstract star -->
  <polygon points="780,340 782,347 789,347 783,352 785,359 780,354 775,359 777,352 771,347 778,347" fill="#f472b6"/>

  <!-- Floating metric cards -->
  <!-- Card 1: Engagement -->
  <g transform="translate(60, 110)">
    <rect width="140" height="62" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="140" height="62" rx="10" fill="white" fill-opacity="0.04"/>
    <text x="12" y="22" font-family="Inter,Arial,sans-serif" font-size="10" fill="#a78bfa" font-weight="600">ENGAGEMENT RATE</text>
    <text x="12" y="44" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">8.4%</text>
    <text x="12" y="57" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981">▲ 2.1% this week</text>
  </g>

  <!-- Card 2: Posts scraped -->
  <g transform="translate(700, 60)">
    <rect width="150" height="62" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="150" height="62" rx="10" fill="white" fill-opacity="0.04"/>
    <text x="12" y="22" font-family="Inter,Arial,sans-serif" font-size="10" fill="#06b6d4" font-weight="600">POSTS SCRAPED</text>
    <text x="12" y="44" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">2.4M</text>
    <text x="12" y="57" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa">Last 24 hours</text>
  </g>

  <!-- Card 3: Sentiment -->
  <g transform="translate(680, 440)">
    <rect width="160" height="62" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="160" height="62" rx="10" fill="white" fill-opacity="0.04"/>
    <text x="12" y="22" font-family="Inter,Arial,sans-serif" font-size="10" fill="#ec4899" font-weight="600">SENTIMENT SCORE</text>
    <!-- Gauge bars -->
    <rect x="12" y="30" width="60" height="7" rx="3" fill="#10b981" opacity="0.9"/>
    <rect x="76" y="30" width="25" height="7" rx="3" fill="#f59e0b" opacity="0.9"/>
    <rect x="105" y="30" width="20" height="7" rx="3" fill="#ef4444" opacity="0.9"/>
    <text x="12" y="55" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a0aec0">Positive 58%  Neutral 24%  Neg 18%</text>
  </g>

  <!-- Card 4: Followers -->
  <g transform="translate(60, 400)">
    <rect width="150" height="62" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <rect width="150" height="62" rx="10" fill="white" fill-opacity="0.04"/>
    <text x="12" y="22" font-family="Inter,Arial,sans-serif" font-size="10" fill="#10b981" font-weight="600">FOLLOWER GROWTH</text>
    <text x="12" y="44" font-family="Inter,Arial,sans-serif" font-size="22" fill="white" font-weight="700">+14.7K</text>
    <text x="12" y="57" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa">Across 50+ accounts</text>
  </g>

  <!-- Moving data particles on lines -->
  <circle cx="315" cy="240" r="3" fill="#a78bfa" filter="url(#glow)" opacity="0.9"/>
  <circle cx="585" cy="230" r="3" fill="#06b6d4" filter="url(#glow)" opacity="0.9"/>
  <circle cx="375" cy="350" r="3" fill="#ec4899" filter="url(#glow)" opacity="0.9"/>
  <circle cx="540" cy="340" r="3" fill="#a78bfa" filter="url(#glow)" opacity="0.9"/>

  <!-- Bottom mini bar chart area -->
  <g transform="translate(330, 450)" opacity="0.7">
    <rect x="0" y="30" width="12" height="30" rx="2" fill="url(#barGrad)"/>
    <rect x="18" y="15" width="12" height="45" rx="2" fill="url(#barGrad)"/>
    <rect x="36" y="20" width="12" height="40" rx="2" fill="url(#barGrad)"/>
    <rect x="54" y="5" width="12" height="55" rx="2" fill="url(#barGrad)"/>
    <rect x="72" y="10" width="12" height="50" rx="2" fill="url(#barGrad)"/>
    <rect x="90" y="25" width="12" height="35" rx="2" fill="url(#barGrad)"/>
    <rect x="108" y="0" width="12" height="60" rx="2" fill="#06b6d4"/>
    <text x="0" y="72" font-family="Inter,Arial,sans-serif" font-size="8" fill="#a78bfa" opacity="0.7">Weekly Engagement Trend</text>
  </g>

  <!-- Decorative ring bottom right -->
  <circle cx="820" cy="500" r="50" stroke="#4f46e5" stroke-width="0.5" stroke-dasharray="3 5" fill="none" opacity="0.4"/>
  <circle cx="820" cy="500" r="35" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="2 4" fill="none" opacity="0.3"/>
</svg>
