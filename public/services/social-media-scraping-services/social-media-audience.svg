<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#1a0d35"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)"/>

  <!-- Central glow -->
  <ellipse cx="400" cy="260" rx="220" ry="220" fill="url(#centerGlow)"/>

  <!-- Concentric network rings -->
  <circle cx="400" cy="260" r="170" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="4 8" fill="none" opacity="0.4"/>
  <circle cx="400" cy="260" r="130" stroke="#4f46e5" stroke-width="0.5" stroke-dasharray="3 6" fill="none" opacity="0.4"/>
  <circle cx="400" cy="260" r="90" stroke="#6d28d9" stroke-width="0.5" stroke-dasharray="2 5" fill="none" opacity="0.5"/>

  <!-- Connection lines from outer nodes to center -->
  <line x1="230" y1="130" x2="400" y2="260" stroke="#ec4899" stroke-width="1.2" opacity="0.4"/>
  <line x1="570" y1="130" x2="400" y2="260" stroke="#06b6d4" stroke-width="1.2" opacity="0.4"/>
  <line x1="220" y1="380" x2="400" y2="260" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>
  <line x1="580" y1="380" x2="400" y2="260" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
  <line x1="155" y1="255" x2="400" y2="260" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <line x1="645" y1="255" x2="400" y2="260" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <line x1="400" y1="75" x2="400" y2="260" stroke="#8b5cf6" stroke-width="1" opacity="0.35"/>
  <line x1="400" y1="445" x2="400" y2="260" stroke="#8b5cf6" stroke-width="1" opacity="0.35"/>

  <!-- Mid ring nodes - small -->
  <circle cx="310" cy="178" r="12" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
  <circle cx="310" cy="178" r="6" fill="#ec4899" opacity="0.7"/>
  <circle cx="490" cy="178" r="12" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="490" cy="178" r="6" fill="#06b6d4" opacity="0.7"/>
  <circle cx="308" cy="340" r="12" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="308" cy="340" r="6" fill="#10b981" opacity="0.7"/>
  <circle cx="492" cy="340" r="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="492" cy="340" r="6" fill="#f59e0b" opacity="0.7"/>
  <circle cx="230" cy="260" r="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="230" cy="260" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="570" cy="260" r="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="570" cy="260" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="400" cy="170" r="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="400" cy="170" r="5" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="400" cy="350" r="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="400" cy="350" r="5" fill="#8b5cf6" opacity="0.7"/>

  <!-- Outer large nodes with glow -->
  <!-- Node 1 top-left - ec4899 -->
  <ellipse cx="230" cy="130" rx="50" ry="50" fill="url(#node1)"/>
  <circle cx="230" cy="130" r="32" fill="#1e1040" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
  <circle cx="230" cy="130" r="24" fill="#2d0f26"/>
  <!-- person icon -->
  <circle cx="230" cy="122" r="7" fill="#ec4899" opacity="0.9"/>
  <path d="M215 144 Q230 135 245 144" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="230" y="173" font-family="Inter,Arial,sans-serif" font-size="9" fill="#ec4899" text-anchor="middle" font-weight="600">Audience</text>

  <!-- Node 2 top-right - 06b6d4 -->
  <ellipse cx="570" cy="130" rx="50" ry="50" fill="url(#node2)"/>
  <circle cx="570" cy="130" r="32" fill="#051820" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
  <circle cx="570" cy="130" r="24" fill="#071e2a"/>
  <!-- trend up icon -->
  <polyline points="556,138 566,126 576,130 586,118" stroke="#06b6d4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="580,118 586,118 586,124" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="570" y="173" font-family="Inter,Arial,sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle" font-weight="600">Reach</text>

  <!-- Node 3 bottom-left - 10b981 -->
  <ellipse cx="220" cy="385" rx="50" ry="50" fill="url(#node3)"/>
  <circle cx="220" cy="385" r="32" fill="#011810" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
  <circle cx="220" cy="385" r="24" fill="#061f14"/>
  <!-- heart/sentiment icon -->
  <path d="M220 396 C220 396 206 387 206 380 C206 375 210 372 215 375 C217 376 219 378 220 380 C221 378 223 376 225 375 C230 372 234 375 234 380 C234 387 220 396 220 396Z" fill="#10b981" opacity="0.9"/>
  <text x="220" y="428" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981" text-anchor="middle" font-weight="600">Sentiment</text>

  <!-- Node 4 bottom-right - f59e0b -->
  <ellipse cx="580" cy="385" rx="50" ry="50" fill="url(#node4)"/>
  <circle cx="580" cy="385" r="32" fill="#1a1000" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  <circle cx="580" cy="385" r="24" fill="#201500"/>
  <!-- search icon -->
  <circle cx="576" cy="381" r="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="582" y1="387" x2="590" y2="395" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="580" y="428" font-family="Inter,Arial,sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" font-weight="600">Discovery</text>

  <!-- Central hub node -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="260" r="60" fill="#1e1b4b" stroke="url(#ringGrad)" stroke-width="2.5"/>
  </g>
  <circle cx="400" cy="260" r="52" fill="#150e38"/>
  <!-- People/community icon -->
  <circle cx="392" cy="252" r="9" fill="#a78bfa" opacity="0.9"/>
  <circle cx="410" cy="252" r="9" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="400" cy="268" r="9" fill="#7c3aed" opacity="0.9"/>
  <path d="M378 276 Q392 268 406 276" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M396 276 Q410 268 424 276" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Demographic ring - outer arc decoration -->
  <path d="M 340 180 A 80 80 0 0 1 460 180" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 340 340 A 80 80 0 0 0 460 340" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Floating data particles -->
  <circle cx="350" cy="215" r="3.5" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="450" cy="215" r="3.5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="350" cy="308" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="452" cy="308" r="3.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="320" cy="260" r="3" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="480" cy="260" r="3" fill="#ec4899" filter="url(#glow)"/>

  <!-- Info panels -->
  <!-- Left panel -->
  <rect x="30" y="200" width="130" height="100" rx="12" fill="#1a103a" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="48" y="222" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa" font-weight="600">FOLLOWERS</text>
  <text x="48" y="244" font-family="Inter,Arial,sans-serif" font-size="20" fill="white" font-weight="700">2.1M</text>
  <!-- mini sparkline -->
  <polyline points="48,270 65,262 82,265 99,258 116,252 133,248" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="48" y="290" font-family="Inter,Arial,sans-serif" font-size="8" fill="#10b981">▲ Growth: +14K/day</text>

  <!-- Right panel -->
  <rect x="640" y="200" width="130" height="100" rx="12" fill="#1a103a" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="658" y="222" font-family="Inter,Arial,sans-serif" font-size="9" fill="#06b6d4" font-weight="600">DEMOGRAPHICS</text>
  <!-- Donut chart simple -->
  <circle cx="700" cy="255" r="22" fill="none" stroke="#ec4899" stroke-width="7" stroke-dasharray="55 138"/>
  <circle cx="700" cy="255" r="22" fill="none" stroke="#06b6d4" stroke-width="7" stroke-dasharray="42 138" stroke-dashoffset="-55"/>
  <circle cx="700" cy="255" r="22" fill="none" stroke="#10b981" stroke-width="7" stroke-dasharray="41 138" stroke-dashoffset="-97"/>
  <circle cx="700" cy="255" r="15" fill="#1a103a"/>
  <text x="700" y="252" font-family="Inter,Arial,sans-serif" font-size="7" fill="white" text-anchor="middle">3 regions</text>
  <text x="700" y="261" font-family="Inter,Arial,sans-serif" font-size="7" fill="#a78bfa" text-anchor="middle">segmented</text>
  <text x="658" y="292" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9ca3af">Language &amp; country signals</text>

  <!-- Bottom tag row -->
  <rect x="260" y="445" width="70" height="22" rx="11" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="295" y="460" font-family="Inter,Arial,sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">#trending</text>
  <rect x="342" y="445" width="80" height="22" rx="11" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="382" y="460" font-family="Inter,Arial,sans-serif" font-size="9" fill="#06b6d4" text-anchor="middle">#community</text>
  <rect x="434" y="445" width="70" height="22" rx="11" fill="#1e1b4b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="469" y="460" font-family="Inter,Arial,sans-serif" font-size="9" fill="#10b981" text-anchor="middle">#growth</text>
</svg>
