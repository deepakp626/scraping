<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="baBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="bannerHeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#eb1c3f"/>
    </linearGradient>
    <filter id="baShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="36" fill="url(#baBg)"/>

  <!-- Main Card -->
  <g transform="translate(80, 70)" filter="url(#baShadow)">
    <rect width="1040" height="760" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Header -->
    <text x="40" y="56" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#0f172a">Retail Media &amp; Sponsored Banner Auditing</text>
    <text x="40" y="82" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748b">Verify paid ad slot placement, share-of-voice compliance, and creative accuracy</text>

    <!-- Top Hero Banner Ad Mockup (The Ad Being Audited) -->
    <g transform="translate(40, 110)">
      <rect width="960" height="230" rx="20" fill="url(#bannerHeroGrad)"/>
      
      <!-- Content inside the banner -->
      <rect x="36" y="30" width="110" height="26" rx="6" fill="#ffffff" opacity="0.25"/>
      <text x="91" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">SPONSORED HERO</text>

      <text x="36" y="105" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff">FMCG MEGA SALE: BUY 1 GET 1 50% OFF</text>
      <text x="36" y="140" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffedd5">Exclusive discounts on premium grocery essentials • Valid this weekend</text>

      <!-- CTA Button in Banner -->
      <rect x="36" y="165" width="160" height="42" rx="10" fill="#ffffff"/>
      <text x="116" y="191" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ea580c">Shop Essentials →</text>

      <!-- Compliance Stamp Overlay -->
      <g transform="translate(740, 30)">
        <rect width="180" height="50" rx="12" fill="#10b981"/>
        <text x="90" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff">✓ 100% COMPLIANT</text>
      </g>
    </g>

    <!-- Middle Metric Cards Row -->
    <g transform="translate(40, 365)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="220" height="110" rx="16" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#94a3b8">SLOT POSITION</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a">Top Carousel #1</text>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#16a34a">✓ Verified on 34 portals</text>

      <!-- Metric 2 -->
      <rect x="246" y="0" width="220" height="110" rx="16" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#94a3b8">SHARE OF VOICE (SOV)</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#f97316">84.6% Live</text>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748b">Target: 80% SLA met</text>

      <!-- Metric 3 -->
      <rect x="492" y="0" width="220" height="110" rx="16" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#94a3b8">IMPRESSIONS TRACKED</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a">2.4M Verified</text>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#16a34a">▲ 18% higher than benchmark</text>

      <!-- Metric 4 -->
      <rect x="740" y="0" width="220" height="110" rx="16" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#94a3b8">ESTIMATED ROAS</text>
      <text x="20" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#10b981">4.2x Return</text>
      <text x="20" y="90" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748b">Media budget optimization</text>
    </g>

    <!-- Bottom Competitor Banner Defense Grid -->
    <g transform="translate(40, 500)">
      <rect width="960" height="210" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="24" y="36" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0f172a">Competitor Keyword Conquering &amp; Ad Hijack Monitor</text>
      <text x="24" y="58" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Detect when competitor brands buy sponsored slots on your branded keywords</text>

      <!-- Table Row 1 -->
      <g transform="translate(24, 75)">
        <rect width="912" height="48" rx="10" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Keyword: "NutriSpread Peanut Butter"</text>
        <rect x="360" y="12" width="120" height="24" rx="6" fill="#ecfdf5"/>
        <text x="420" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#059669">0 Hijack Attempts</text>
        <text x="560" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748b">Slot Owner: Your Brand (#1)</text>
        <text x="890" y="30" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#10b981">100% Secure</text>
      </g>

      <!-- Table Row 2 -->
      <g transform="translate(24, 135)">
        <rect width="912" height="48" rx="10" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Keyword: "Healthy Breakfast Spreads"</text>
        <rect x="360" y="12" width="120" height="24" rx="6" fill="#fff7ed"/>
        <text x="420" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#ea580c">2 Competitors Bidding</text>
        <text x="560" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748b">Slot Owner: Competitor Y ($0.45 CPC)</text>
        <text x="890" y="30" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#f97316">Action Alert Triggered</text>
      </g>
    </g>
  </g>
</svg>