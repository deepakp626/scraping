<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="barGradYour" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="srShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="36" fill="url(#srBg)"/>

  <!-- Main Container -->
  <g transform="translate(80, 70)" filter="url(#srShadow)">
    <rect width="1040" height="760" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Search Input Bar Header -->
    <g transform="translate(40, 36)">
      <rect width="960" height="60" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="28" y="38" font-size="20">🔍</text>
      <text x="64" y="38" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#0f172a">search: "sparkling prebiotic soda lemon"</text>
      <rect x="760" y="12" width="180" height="36" rx="10" fill="#f97316"/>
      <text x="850" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">Scrape 50+ Apps</text>
    </g>

    <!-- Left Column: Share of Search Donut & Metric -->
    <g transform="translate(40, 130)">
      <rect width="450" height="580" rx="20" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="28" y="40" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#0f172a">Share-of-Search Breakdown</text>
      <text x="28" y="62" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Calculated from 1,200 paginated search queries</text>

      <!-- Center Donut Chart -->
      <g transform="translate(225, 200)">
        <circle cx="0" cy="0" r="95" fill="none" stroke="#f1f5f9" stroke-width="32"/>
        <!-- Your Brand (48%) -->
        <circle cx="0" cy="0" r="95" fill="none" stroke="#f97316" stroke-width="32" stroke-dasharray="286 596" stroke-dashoffset="0" stroke-linecap="round"/>
        <!-- Competitor A (26%) -->
        <circle cx="0" cy="0" r="95" fill="none" stroke="#94a3b8" stroke-width="32" stroke-dasharray="155 596" stroke-dashoffset="-296" stroke-linecap="round"/>
        <!-- Competitor B (16%) -->
        <circle cx="0" cy="0" r="95" fill="none" stroke="#cbd5e1" stroke-width="32" stroke-dasharray="95 596" stroke-dashoffset="-461" stroke-linecap="round"/>
        
        <text x="0" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#0f172a">48.2%</text>
        <text x="0" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#f97316">YOUR BRAND</text>
      </g>

      <!-- Legend -->
      <g transform="translate(40, 350)">
        <!-- Item 1 -->
        <circle cx="10" cy="10" r="6" fill="#f97316"/>
        <text x="26" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#0f172a">Your Brand (Rank #1 Average)</text>
        <text x="370" y="15" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#f97316">48.2%</text>

        <!-- Item 2 -->
        <circle cx="10" cy="45" r="6" fill="#94a3b8"/>
        <text x="26" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#475569">Competitor X (Rank #3 Average)</text>
        <text x="370" y="50" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#475569">26.0%</text>

        <!-- Item 3 -->
        <circle cx="10" cy="80" r="6" fill="#cbd5e1"/>
        <text x="26" y="85" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#475569">Competitor Y (Rank #5 Average)</text>
        <text x="370" y="85" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#475569">15.8%</text>

        <!-- Item 4 -->
        <circle cx="10" cy="115" r="6" fill="#e2e8f0"/>
        <text x="26" y="120" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#64748b">Other Private Labels</text>
        <text x="370" y="120" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#64748b">10.0%</text>
      </g>

      <!-- Badge at bottom of left column -->
      <rect x="40" y="505" width="370" height="45" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
      <text x="225" y="533" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ea580c">★ Leading Shelf Visibility in 42 of 50 Cities</text>
    </g>

    <!-- Right Column: Live Search Rank Ladder -->
    <g transform="translate(520, 130)">
      <rect width="480" height="580" rx="20" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1"/>
      <text x="28" y="40" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#0f172a">Digital Shelf Position Ladder</text>
      <text x="28" y="62" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Real-time organic &amp; sponsored search rankings</text>

      <!-- Slot 1: Your Brand -->
      <g transform="translate(24, 85)">
        <rect width="432" height="105" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#f97316"/>
        <text x="32" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff">#1</text>
        
        <text x="60" y="32" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0f172a">ZestPrebiotic Soda Lemon 330ml</text>
        <text x="60" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#16a34a">Organic Shelf Rank • 100% In Stock</text>
        
        <rect x="60" y="62" width="110" height="22" rx="6" fill="#ecfdf5"/>
        <text x="115" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#059669">4.9 ★ (1,840)</text>
        <text x="390" y="42" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#f97316">$2.49</text>
      </g>

      <!-- Slot 2: Competitor SKU -->
      <g transform="translate(24, 205)">
        <rect width="432" height="105" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#94a3b8"/>
        <text x="32" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff">#2</text>
        
        <text x="60" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#334155">Brand X Sparkling Citrus Tonic</text>
        <text x="60" y="50" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">Organic Shelf Rank • Out of Stock in 3 stores</text>
        
        <rect x="60" y="62" width="110" height="22" rx="6" fill="#f1f5f9"/>
        <text x="115" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#64748b">4.2 ★ (620)</text>
        <text x="390" y="42" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#64748b">$2.99</text>
      </g>

      <!-- Slot 3: Sponsored Ad -->
      <g transform="translate(24, 325)">
        <rect width="432" height="105" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#6366f1"/>
        <text x="32" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff">AD</text>
        
        <text x="60" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#334155">Competitor Y Vitality Soda</text>
        <text x="60" y="50" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#6366f1">Sponsored Ad Placement • Cost-per-click audit</text>
        
        <rect x="60" y="62" width="110" height="22" rx="6" fill="#e0e7ff"/>
        <text x="115" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#4338ca">Paid Placement</text>
        <text x="390" y="42" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#64748b">$3.19</text>
      </g>

      <!-- Realtime Audit Notification Bar -->
      <g transform="translate(24, 450)">
        <rect width="432" height="85" rx="14" fill="#0f172a"/>
        <circle cx="36" cy="42" r="14" fill="#22c55e"/>
        <text x="36" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ffffff">✓</text>
        <text x="64" y="36" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff">30-Day Position Tracker: Stable #1</text>
        <text x="64" y="56" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Bypassing anti-bot checks across Amazon, Blinkit &amp; Zepto</text>
      </g>
    </g>
  </g>
</svg>