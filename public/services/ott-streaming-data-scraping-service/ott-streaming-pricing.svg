  <text x="88" y="235" font-family="Inter, sans-serif" font-size="12" fill="#374151">✓  1 Screen</text>
  <text x="88" y="255" font-family="Inter, sans-serif" font-size="12" fill="#374151">✓  Limited Catalog</text>
  <text x="88" y="275" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">✗  Downloads</text>
  <text x="88" y="295" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">✗  4K Ultra HD</text>
