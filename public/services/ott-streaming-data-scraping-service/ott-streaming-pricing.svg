  <text x="646" y="255" font-family="Inter, sans-serif" font-size="12" fill="#374151">✓  Full Catalog</text>
  <text x="646" y="275" font-family="Inter, sans-serif" font-size="12" fill="#374151">✓  Downloads</text>
