  <!-- BASIC Plan Card -->
  <rect x="50" y="88" width="240" height="280" rx="16" fill="white" filter="url(#cs)"/>
  <rect x="50" y="88" width="240" height="8" rx="8" fill="#e5e7eb"/>
  <text x="170" y="128" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#6b7280" text-anchor="middle">BASIC</text>
