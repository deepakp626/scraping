  <text x="178" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Mar</text>
  <text x="254" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">May</text>
  <text x="330" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Jul</text>
  <text x="406" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Sep</text>
  <text x="482" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Nov</text>
  <text x="558" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Jan</text>
  <text x="634" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Mar</text>
  <text x="710" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">May</text>
  <text x="786" y="500" font-family="Inter, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">Jul</text>

  <!-- Bars -->
  <rect x="82" y="462" width="40" height="28" rx="4" fill="url(#barG1)" opacity="0.7"/>
  <rect x="158" y="455" width="40" height="35" rx="4" fill="url(#barG1)" opacity="0.8"/>
  <rect x="234" y="448" width="40" height="42" rx="4" fill="url(#barG1)"/>
  <rect x="310" y="452" width="40" height="38" rx="4" fill="url(#barG2)"/>
  <rect x="386" y="444" width="40" height="46" rx="4" fill="url(#barG2)"/>
  <rect x="462" y="458" width="40" height="32" rx="4" fill="url(#barG3)" opacity="0.8"/>
  <rect x="538" y="450" width="40" height="40" rx="4" fill="url(#barG3)"/>
  <rect x="614" y="442" width="40" height="48" rx="4" fill="url(#barG1)"/>
  <rect x="690" y="436" width="40" height="54" rx="4" fill="url(#barG2)"/>
  <rect x="766" y="430" width="40" height="60" rx="4" fill="url(#premGrad)"/>

  <!-- Promo badge -->
  <rect x="740" y="390" width="100" height="26" rx="13" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="790" y="407" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">🏷️  30% Promo</text>
