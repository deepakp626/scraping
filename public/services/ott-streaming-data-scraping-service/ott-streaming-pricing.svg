  <text x="360" y="243" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">✓  2 Screens</text>
  <text x="360" y="263" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">✓  Full Catalog</text>
  <text x="360" y="283" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">✓  Downloads</text>
  <text x="360" y="303" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">✗  4K Ultra HD</text>
  <rect x="360" y="338" width="180" height="28" rx="14" fill="white"/>
