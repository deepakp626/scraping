<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="800" rx="32" fill="url(#bBg)"/>

  <!-- Main Executive Dashboard Card -->
  <g filter="url(#bShadow)" transform="translate(80, 80)">
    <rect width="840" height="640" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 0 28 Q 0 0 28 0 L 812 0 Q 840 0 840 28 L 840 75 L 0 75 Z" fill="#0f172a"/>
    <text x="32" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
      FOOD &amp; RESTAURANT BUSINESS INTELLIGENCE
    </text>
    <text x="560" y="44" fill="#f97316" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
      ENTERPRISE VALUE DASHBOARD
    </text>

    <!-- 4 Key Performance Highlights -->
    <g transform="translate(32, 105)">
      <!-- Card 1 -->
      <rect width="180" height="110" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <text x="16" y="28" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="800">MENU MARGIN</text>
      <text x="16" y="65" fill="#ea580c" font-family="system-ui, sans-serif" font-size="32" font-weight="900">+34%</text>
      <text x="16" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Pricing Optimization</text>

      <!-- Card 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="110" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="16" y="28" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="800">RESEARCH TIME</text>
        <text x="16" y="65" fill="#16a34a" font-family="system-ui, sans-serif" font-size="32" font-weight="900">-75%</text>
        <text x="16" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Automated Scraping</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(390, 0)">
        <rect width="180" height="110" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
        <text x="16" y="28" fill="#1e40af" font-family="system-ui, sans-serif" font-size="11" font-weight="800">COVERAGE</text>
        <text x="16" y="65" fill="#2563eb" font-family="system-ui, sans-serif" font-size="32" font-weight="900">80+</text>
        <text x="16" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Food Platforms</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(585, 0)">
        <rect width="190" height="110" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="16" y="28" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="800">DATA UPTIME</text>
        <text x="16" y="65" fill="#0f172a" font-family="system-ui, sans-serif" font-size="32" font-weight="900">99.9%</text>
        <text x="16" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">SLA Guaranteed</text>
      </g>
    </g>

    <!-- Large Multi-Line Growth & Market Share Chart -->
    <g transform="translate(32, 240)">
      <rect width="775" height="260" rx="20" fill="#0f172a"/>
      <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">
        COMPETITIVE INTELLIGENCE &amp; REVENUE IMPACT
      </text>
      
      <!-- Chart Legend -->
      <circle cx="480" cy="30" r="4" fill="#f97316"/>
      <text x="492" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Revenue with Data Intelligence</text>

      <circle cx="670" cy="30" r="4" fill="#64748b"/>
      <text x="682" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Traditional Ops</text>

      <!-- Chart Grid Lines -->
      <line x1="50" y1="200" x2="720" y2="200" stroke="#334155" stroke-width="1"/>
      <line x1="50" y1="150" x2="720" y2="150" stroke="#334155" stroke-width="1"/>
      <line x1="50" y1="100" x2="720" y2="100" stroke="#334155" stroke-width="1"/>
      <line x1="50" y1="60" x2="720" y2="60" stroke="#334155" stroke-width="1"/>

      <!-- Chart Line 1: Orange Active Growth -->
      <path d="M 60 180 Q 180 160 300 130 T 520 80 T 700 65" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      <circle cx="700" cy="65" r="6" fill="#f97316"/>

      <!-- Chart Line 2: Grey Flat Baseline -->
      <path d="M 60 190 Q 180 185 300 180 T 520 175 T 700 170" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- X Axis Labels -->
      <text x="60" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q1</text>
      <text x="190" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q2</text>
      <text x="320" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q3</text>
      <text x="450" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q4</text>
      <text x="580" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q5</text>
      <text x="690" y="225" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Q6</text>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(32, 520)">
      <rect width="245" height="85" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🔍 Dynamic Discovery</text>
      <text x="16" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Power your food apps with fresh restaurant data feeds.</text>

      <g transform="translate(265, 0)">
        <rect width="245" height="85" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚡ Menu Trend Alerting</text>
        <text x="16" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Instant alerts on price changes and new dish launches.</text>
      </g>

      <g transform="translate(530, 0)">
        <rect width="245" height="85" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📈 Location Intelligence</text>
        <text x="16" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Find underserved dining zones for rapid expansion.</text>
      </g>
    </g>
  </g>
</svg>