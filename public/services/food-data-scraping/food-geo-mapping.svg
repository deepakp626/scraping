      <text x="16" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Cuisine Density: High Saturation</text>
      <text x="16" y="80" fill="#ea580c" font-family="system-ui, sans-serif" font-size="24" font-weight="900">184 Venues</text>
      <rect x="16" y="92" width="120" height="18" rx="9" fill="#fed7aa"/>
      <text x="24" y="105" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="800">62 Italian • 45 Asian</text>

      <!-- Zone Stats Box 2: Opportunity -->
      <g transform="translate(0, 135)">
        <rect width="330" height="135" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
        <text x="16" y="26" fill="#166534" font-family="system-ui, sans-serif" font-size="14" font-weight="800">✨ West Midtown (Opportunity Zone)</text>
        <text x="16" y="48" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">High Footfall • Low Specialty Dine</text>
        <text x="16" y="80" fill="#16a34a" font-family="system-ui, sans-serif" font-size="24" font-weight="900">+34% Demand Gap</text>
        <text x="16" y="105" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Ideal for Dark Kitchen / QSR Outlet</text>
      </g>

      <!-- Proximity Metrics -->
      <g transform="translate(0, 285)">
        <rect width="330" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="26" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">PROXIMITY METRICS</text>
        <text x="16" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="12">🚗 Avg Delivery ETA: 24 mins</text>
        <text x="16" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="12">📦 Delivery Radius Coverage: 98.2%</text>
        <text x="16" y="96" fill="#475569" font-family="system-ui, sans-serif" font-size="12">🏙️ Neighborhood Tags: 48 Districts</text>
      </g>

      <!-- Export CTA -->
      <g transform="translate(0, 410)">
        <rect width="330" height="95" rx="14" fill="#0f172a"/>
        <text x="16" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">EXPORT GEO-DATA FEED</text>
        <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">GeoJSON • Shapefile • BigQuery GIS</text>
        <text x="16" y="76" fill="#22c55e" font-family="monospace" font-size="11">GIS_EXPORT_STATUS: READY</text>
      </g>
    </g>
  </g>
</svg>