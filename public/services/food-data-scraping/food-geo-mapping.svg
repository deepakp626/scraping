  <!-- Right: Location Intelligence & Market Saturation Analytics -->
  <g filter="url(#f4Shadow)" transform="translate(570, 80)">
    <rect width="370" height="640" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 0 24 Q 0 0 24 0 L 346 0 Q 370 0 370 24 L 370 70 L 0 70 Z" fill="#f97316"/>
