<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eb1c3f"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" rx="36" fill="url(#heroBg)"/>

  <!-- Tech Grid Lines -->
  <g opacity="0.35">
    <circle cx="1000" cy="200" r="320" fill="none" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="1000" cy="200" r="480" fill="none" stroke="#fed7aa" stroke-width="1" stroke-dasharray="8 8"/>
    <circle cx="200" cy="720" r="240" fill="none" stroke="#ffedd5" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Main Central Card: Restaurant Scraping Hub -->
  <g filter="url(#shadowLg)" transform="translate(180, 100)">
    <rect width="840" height="660" rx="28" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
    
    <!-- Top Header Bar -->
    <path d="M 0 28 Q 0 0 28 0 L 812 0 Q 840 0 840 28 L 840 70 L 0 70 Z" fill="#0f172a"/>
    <circle cx="36" cy="35" r="7" fill="#ef4444"/>
    <circle cx="60" cy="35" r="7" fill="#f59e0b"/>
    <circle cx="84" cy="35" r="7" fill="#10b981"/>
    
    <text x="130" y="41" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
      FOOD_DATA_SCRAPER_CORE // LIVE PIPELINE v4.2
    </text>
    <rect x="660" y="20" width="150" height="30" rx="15" fill="#1e293b"/>
    <circle cx="678" cy="35" r="5" fill="#22c55e"/>
    <text x="692" y="40" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LIVE CRAWLING</text>

    <!-- Sub-header Metrics Row -->
    <g transform="translate(40, 95)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="230" height="85" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <text x="20" y="32" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INDEXED VENUES</text>
      <text x="20" y="65" fill="#ea580c" font-family="system-ui, sans-serif" font-size="28" font-weight="900">50,842,190</text>
      
      <!-- Metric 2 -->
      <rect x="255" y="0" width="230" height="85" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="275" y="32" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EXTRACTION ACCURACY</text>
      <text x="275" y="65" fill="#16a34a" font-family="system-ui, sans-serif" font-size="28" font-weight="900">99.94%</text>

      <!-- Metric 3 -->
      <rect x="510" y="0" width="250" height="85" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="530" y="32" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DAILY REVIEWS MINED</text>
      <text x="530" y="65" fill="#0f172a" font-family="system-ui, sans-serif" font-size="28" font-weight="900">4.2M / DAY</text>
    </g>

    <!-- Inner Grid: Restaurant Card + Menu Card + Map Pin Card -->
    <g transform="translate(40, 205)">
      <!-- Left Column: Scraped Restaurant Profile -->
      <g>
        <rect width="360" height="410" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect x="20" y="20" width="320" height="130" rx="14" fill="#0f172a"/>
        <!-- Food photo placeholder vector -->
        <circle cx="180" cy="85" r="45" fill="#ea580c" opacity="0.3"/>
        <path d="M 150 85 Q 180 50 210 85 Q 180 120 150 85 Z" fill="url(#accentGrad)"/>
        <circle cx="180" cy="85" r="15" fill="#fff"/>
        <rect x="35" y="30" width="105" height="24" rx="12" fill="#f97316"/>
        <text x="47" y="46" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">TOP RATED</text>

        <!-- Restaurant Details -->
        <text x="24" y="180" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">The Artisan Bistro &amp; Grill</text>
        <text x="24" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Italian • Fine Dining • Farm-to-Table</text>
        
        <!-- Stars & Reviews -->
        <g transform="translate(24, 215)">
          <text x="0" y="16" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16">★★★★★</text>
          <text x="80" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4.9</text>
          <text x="105" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">(2,840 reviews)</text>
        </g>

        <!-- Tag pills -->
        <rect x="24" y="245" width="80" height="26" rx="13" fill="#ffedd5"/>
        <text x="36" y="262" fill="#c2410c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$$$ Price</text>

        <rect x="112" y="245" width="100" height="26" rx="13" fill="#dcfce7"/>
        <text x="124" y="262" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">✓ Open Now</text>

        <rect x="220" y="245" width="115" height="26" rx="13" fill="#e0f2fe"/>
        <text x="232" y="262" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Reservations</text>

        <!-- Scraped Meta Row -->
        <line x1="24" y1="290" x2="336" y2="290" stroke="#e2e8f0" stroke-width="1"/>
        <text x="24" y="315" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📍 742 Evergreen Terrace, Downtown</text>
        <text x="24" y="340" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📞 +1 (555) 234-8900</text>
        <text x="24" y="365" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🕒 Mon-Sun: 11:30 AM – 11:00 PM</text>

        <rect x="24" y="380" width="312" height="18" rx="4" fill="#f1f5f9"/>
        <text x="32" y="393" fill="#64748b" font-family="monospace" font-size="10">SOURCE_ID: YELP_US_4901 • MAPS_CID_910</text>
      </g>

      <!-- Right Column: Extracted Menu & Live Price Monitor -->
      <g transform="translate(385, 0)">
        <rect width="375" height="410" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
        
        <text x="24" y="35" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Scraped Menu &amp; Item Pricing</text>
        <text x="24" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Structured Menu Tree Hierarchy</text>

        <!-- Menu Item 1 -->
        <g transform="translate(20, 75)">
          <rect width="335" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="35" cy="35" r="20" fill="#ffedd5"/>
          <text x="28" y="42" fill="#ea580c" font-family="system-ui, sans-serif" font-size="18">🍝</text>
          <text x="65" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Truffle Tagliolini Pasta</text>
          <text x="65" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Black truffle, parmesan cream, fresh herbs</text>
          <text x="275" y="35" fill="#ea580c" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$26.50</text>
          <rect x="275" y="45" width="48" height="16" rx="8" fill="#dcfce7"/>
          <text x="281" y="56" fill="#15803d" font-family="system-ui, sans-serif" font-size="9" font-weight="800">VEGAN</text>
        </g>

        <!-- Menu Item 2 -->
        <g transform="translate(20, 155)">
          <rect width="335" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="35" cy="35" r="20" fill="#fee2e2"/>
          <text x="28" y="42" fill="#dc2626" font-family="system-ui, sans-serif" font-size="18">🥩</text>
          <text x="65" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Prime Angus Ribeye (12oz)</text>
          <text x="65" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Garlic herb butter, roasted asparagus</text>
          <text x="275" y="35" fill="#ea580c" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$42.00</text>
          <rect x="275" y="45" width="48" height="16" rx="8" fill="#e0f2fe"/>
          <text x="288" y="56" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9" font-weight="800">GF</text>
        </g>

        <!-- Menu Item 3 -->
        <g transform="translate(20, 235)">
          <rect width="335" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <circle cx="35" cy="35" r="20" fill="#fef3c7"/>
          <text x="28" y="42" fill="#d97706" font-family="system-ui, sans-serif" font-size="18">🍕</text>
          <text x="65" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Artisan Burrata Pizza</text>
          <text x="65" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">San Marzano tomato, fresh basil, EVOO</text>
          <text x="275" y="35" fill="#ea580c" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$19.50</text>
          <rect x="270" y="45" width="55" height="16" rx="8" fill="#ffedd5"/>
          <text x="275" y="56" fill="#ea580c" font-family="system-ui, sans-serif" font-size="9" font-weight="800">-8% PROMO</text>
        </g>

        <!-- Price Intelligence Sparkline Box -->
        <g transform="translate(20, 315)">
          <rect width="335" height="80" rx="12" fill="#0f172a"/>
          <text x="16" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">COMPETITOR BENCHMARK</text>
          <text x="16" y="50" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="900">14.2% Lower</text>
          <text x="16" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">vs. Downtown Italian Avg ($32.40)</text>
          <!-- Mini SVG Sparkline -->
          <path d="M 210 55 L 235 48 L 260 52 L 285 38 L 315 32" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="315" cy="32" r="4" fill="#22c55e"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating Floating Badges for Visual Depth -->
  <g filter="url(#shadowSm)" transform="translate(60, 220)">
    <rect width="180" height="70" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#ffedd5"/>
    <text x="27" y="41" fill="#ea580c" font-family="system-ui, sans-serif" font-size="16">⚡</text>
    <text x="65" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LATENCY</text>
    <text x="65" y="50" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">45ms API</text>
  </g>

  <g filter="url(#shadowSm)" transform="translate(980, 560)">
    <rect width="180" height="70" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#dcfce7"/>
    <text x="27" y="41" fill="#16a34a" font-family="system-ui, sans-serif" font-size="16">🛡️</text>
    <text x="65" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ANTI-BOT</text>
    <text x="65" y="50" fill="#16a34a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">100% BYPASS</text>
  </g>
</svg>