    <text x="24" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">
      STRUCTURED MENU TREE
    </text>
    
    <g transform="translate(24, 90)">
      <!-- Branch 1 -->
      <rect width="350" height="40" rx="8" fill="#ffedd5"/>
      <text x="16" y="25" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📂 01. Appetizers &amp; Antipasti (14 Items)</text>

      <!-- Sub items -->
      <g transform="translate(20, 50)">
        <text x="0" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">├─ Burrata Caprese ($16.50)</text>
        <text x="0" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">├─ Crispy Calamari Fritti ($18.00)</text>
        <text x="0" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">└─ Beef Carpaccio ($19.50)</text>
      </g>

      <!-- Branch 2 -->
      <g transform="translate(0, 125)">
        <rect width="350" height="40" rx="8" fill="#f97316"/>
        <text x="16" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📂 02. Handmade Pastas &amp; Mains (22 Items)</text>

        <g transform="translate(20, 50)">
          <text x="0" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">├─ Truffle Tagliolini ($26.50) [Active Watch]</text>
          <text x="0" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">├─ Lobster Ravioli ($32.00)</text>
          <text x="0" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">├─ Pappardelle Cinghiale ($28.00)</text>
          <text x="0" y="76" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">└─ Wild Mushroom Risotto ($24.00)</text>
