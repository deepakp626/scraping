      <g transform="translate(0, 270)">
        <rect width="350" height="40" rx="8" fill="#ffedd5"/>
        <text x="16" y="25" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📂 03. Woodfired Artisan Pizza (10 Items)</text>
      </g>

      <!-- Branch 4 -->
      <g transform="translate(0, 330)">
        <rect width="350" height="40" rx="8" fill="#ffedd5"/>
        <text x="16" y="25" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📂 04. Desserts &amp; Gelato (8 Items)</text>
      </g>

      <!-- Branch 5 -->
      <g transform="translate(0, 390)">
        <rect width="350" height="40" rx="8" fill="#ffedd5"/>
        <text x="16" y="25" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📂 05. Wine List &amp; Craft Cocktails (45 Items)</text>
