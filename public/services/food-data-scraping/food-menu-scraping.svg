        <!-- Legend -->
        <circle cx="20" cy="55" r="4" fill="#f97316"/>
        <text x="30" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Toscana Osteria</text>
        <circle cx="150" cy="55" r="4" fill="#38bdf8"/>
