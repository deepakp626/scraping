  <!-- Right: Item Detail & Real-Time Price Fluctuation Card -->
  <g filter="url(#f2Shadow)" transform="translate(500, 80)">
    <rect width="440" height="640" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 0 24 Q 0 0 24 0 L 416 0 Q 440 0 440 24 L 440 70 L 0 70 Z" fill="#f97316"/>
    <text x="24" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">
