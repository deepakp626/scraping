      <text x="20" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Category: Handmade Pastas • SKU #TM-908</text>
      <text x="20" y="90" fill="#ea580c" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$26.50</text>
      <text x="125" y="90" fill="#16a34a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">+$2.00 (Updated 2h ago)</text>

      <rect x="20" y="105" width="80" height="22" rx="11" fill="#dcfce7"/>
      <text x="28" y="120" fill="#15803d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🌿 VEGETARIAN</text>

