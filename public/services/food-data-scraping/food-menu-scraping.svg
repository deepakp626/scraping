        <line x1="30" y1="110" x2="360" y2="110" stroke="#334155" stroke-width="1"/>
        <line x1="30" y1="70" x2="360" y2="70" stroke="#334155" stroke-width="1"/>

        <!-- Line 1: Target -->
        <path d="M 40 140 L 100 135 L 160 135 L 220 120 L 280 120 L 340 100" fill="none" stroke="#f97316" stroke-width="3"/>
        <circle cx="340" cy="100" r="5" fill="#f97316"/>

        <!-- Line 2: Market -->
        <path d="M 40 90 L 100 95 L 160 85 L 220 90 L 280 85 L 340 80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

        <!-- Month Labels -->
        <text x="40" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">JAN</text>
        <text x="100" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">FEB</text>
        <text x="160" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">MAR</text>
        <text x="220" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">APR</text>
        <text x="280" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">MAY</text>
        <text x="340" y="175" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">JUN</text>
      </g>

      <!-- Change Trigger Notification -->
      <g transform="translate(0, 380)">
        <rect width="390" height="130" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        <text x="20" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800">AUTOMATED PRICE CHANGE ALERTS</text>
        <text x="20" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="12">🔔 Webhook dispatched to PriceYield Service</text>
        <text x="20" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="12">📦 Ingredient Change: Organic Summer Truffle added</text>
        <text x="20" y="98" fill="#16a34a" font-family="monospace" font-size="11">PRICE_STATUS: MONITORING_ACTIVE [24/7]</text>
