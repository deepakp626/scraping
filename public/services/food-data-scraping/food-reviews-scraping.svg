        <text x="16" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Value for Money</text>
        <text x="310" y="28" fill="#eab308" font-family="system-ui, sans-serif" font-size="14" font-weight="800">84% +</text>
