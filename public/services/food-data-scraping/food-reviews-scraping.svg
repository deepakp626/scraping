    <text x="24" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AGGREGATED RATING</text>
    <text x="24" y="85" fill="#f97316" font-family="system-ui, sans-serif" font-size="44" font-weight="900">4.86</text>
    <text x="130" y="70" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20">★★★★★</text>
    <text x="24" y="125" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Based on 18,490 Verified Reviews</text>

    <!-- Sentiment Breakdown Card -->
    <g transform="translate(305, 0)">
      <rect width="270" height="150" rx="20" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#f3Shadow)"/>
      <text x="24" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NLP SENTIMENT INDEX</text>
      <text x="24" y="85" fill="#16a34a" font-family="system-ui, sans-serif" font-size="44" font-weight="900">92.4%</text>
      <rect x="24" y="108" width="180" height="16" rx="8" fill="#dcfce7"/>
      <text x="32" y="120" fill="#15803d" font-family="system-ui, sans-serif" font-size="10" font-weight="800">POSITIVE SENTIMENT</text>
    </g>

    <!-- Review Velocity Card -->
