        <text x="16" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ambiance &amp; Cleanliness</text>
        <text x="310" y="28" fill="#16a34a" font-family="system-ui, sans-serif" font-size="14" font-weight="800">94% +</text>
