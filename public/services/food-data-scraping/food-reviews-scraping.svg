      <rect width="270" height="150" rx="20" fill="#0f172a" filter="url(#f3Shadow)"/>
      <text x="24" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CRAWL FREQUENCY</text>
      <text x="24" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="900">Hourly</text>
      <text x="24" y="125" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">⚡ 0 Captcha Blocks • 100% Fresh</text>
