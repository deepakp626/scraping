        <text x="60" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Marcus D. • Google Maps Local Guide</text>
        <text x="60" y="48" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12">★★★★★ (Google Maps)</text>
        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="12">"Great wine selection and prime ribeye steak cooked to perfection. 10/10 experience."</text>
        <text x="20" y="100" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SENTIMENT: POSITIVE (+0.92)</text>
      </g>

      <!-- Review 3 -->
      <g transform="translate(0, 260)">
        <rect width="390" height="115" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="35" cy="35" r="16" fill="#8b5cf6"/>
        <text x="28" y="41" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SK</text>
        <text x="60" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Sarah K. • Yelp Elite '24</text>
