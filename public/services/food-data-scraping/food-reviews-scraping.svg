        <text x="20" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="12">"Delicious burrata pizza! A bit crowded on Saturday night but worth the 15m wait."</text>
        <text x="20" y="100" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10" font-weight="800">SENTIMENT: POSITIVE (+0.81)</text>
