      <text x="20" y="70" fill="#f43f5e">"brand_name"</text><text x="175" y="70" fill="#94a3b8">:</text><text x="195" y="70" fill="#fef08a">"Toscana Osteria &amp; Bar"</text><text x="410" y="70" fill="#94a3b8">,</text>
      
      <text x="20" y="95" fill="#f43f5e">"cuisine_tags"</text><text x="175" y="95" fill="#94a3b8">:</text><text x="195" y="95" fill="#38bdf8">[</text><text x="205" y="95" fill="#fef08a">"Italian"</text><text x="290" y="95" fill="#94a3b8">,</text><text x="305" y="95" fill="#fef08a">"Tuscan"</text><text x="385" y="95" fill="#38bdf8">]</text><text x="395" y="95" fill="#94a3b8">,</text>
      
