      <text x="40" y="295" fill="#f43f5e">"postcode"</text><text x="175" y="295" fill="#94a3b8">:</text><text x="195" y="295" fill="#fef08a">"10036"</text>
      <text x="20" y="320" fill="#38bdf8">}</text><text x="30" y="320" fill="#94a3b8">,</text>

