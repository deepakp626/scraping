      <text x="40" y="370" fill="#38bdf8">{</text>
      <text x="60" y="395" fill="#f43f5e">"item_name"</text><text x="175" y="395" fill="#94a3b8">:</text><text x="195" y="395" fill="#fef08a">"Wild Truffle Gnocchi"</text><text x="410" y="395" fill="#94a3b8">,</text>
      <text x="60" y="420" fill="#f43f5e">"item_price"</text><text x="175" y="420" fill="#94a3b8">:</text><text x="195" y="420" fill="#4ade80">24.50</text><text x="245" y="420" fill="#94a3b8">,</text>
      <text x="60" y="445" fill="#f43f5e">"currency"</text><text x="175" y="445" fill="#94a3b8">:</text><text x="195" y="445" fill="#fef08a">"USD"</text><text x="245" y="445" fill="#94a3b8">,</text>
      <text x="60" y="470" fill="#f43f5e">"allergens"</text><text x="175" y="470" fill="#94a3b8">:</text><text x="195" y="470" fill="#38bdf8">[</text><text x="205" y="470" fill="#fef08a">"Dairy"</text><text x="270" y="470" fill="#94a3b8">,</text><text x="285" y="470" fill="#fef08a">"Gluten"</text><text x="360" y="470" fill="#38bdf8">]</text>
      <text x="40" y="495" fill="#38bdf8">}</text>
      <text x="20" y="520" fill="#38bdf8">]</text>
      <text x="0" y="545" fill="#38bdf8">}</text>
