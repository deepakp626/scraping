<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#065f46" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>

  <g transform="translate(50, 60)" filter="url(#shadow)">
    <!-- Main container -->
    <rect width="400" height="360" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

    <!-- Search bar mockup & Sponsored Banner -->
    <g transform="translate(30, 25)">
      <!-- Mockup app search bar -->
      <rect width="340" height="30" rx="15" fill="#f3f4f6"/>
      <circle cx="20" cy="15" r="4" fill="none" stroke="#9ca3af" stroke-width="2"/>
      <line x1="23" y1="18" x2="28" y2="23" stroke="#9ca3af" stroke-width="2"/>
      <text x="40" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Search for Cola, Chips...</text>

      <!-- Sponsored Ad Banner Mockup -->
      <rect y="45" width="340" height="70" rx="8" fill="url(#greenGrad)"/>
      <text x="15" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff">SPONSORED BRAND PLACEMENT</text>
      <text x="15" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">Audit banner shares across stores in real-time</text>
      <rect x="250" y="63" width="75" height="24" rx="12" fill="#ffffff"/>
      <text x="287" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="middle">Click Rate: 4.8%</text>
    </g>

    <!-- Organic share metrics comparison -->
    <g transform="translate(30, 165)">
      <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#111827">Share of Search: Soft Drinks Category</text>
      
      <!-- Brand 1 share bar -->
      <g transform="translate(0, 35)">
        <text y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#374151">Coca-Cola Co.</text>
        <rect x="110" y="0" width="160" height="12" rx="6" fill="#f3f4f6"/>
        <rect x="110" y="0" width="72" height="12" rx="6" fill="#10b981"/>
        <text x="280" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#111827">45.2% Share</text>
      </g>

      <!-- Brand 2 share bar -->
      <g transform="translate(0, 65)">
        <text y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#374151">PepsiCo</text>
        <rect x="110" y="0" width="160" height="12" rx="6" fill="#f3f4f6"/>
        <rect x="110" y="0" width="56" height="12" rx="6" fill="#6b7280"/>
        <text x="280" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#111827">35.0% Share</text>
      </g>

      <!-- Brand 3 share bar (Private Label) -->
      <g transform="translate(0, 95)">
        <text y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#374151">Own Brand (Private)</text>
        <rect x="110" y="0" width="160" height="12" rx="6" fill="#f3f4f6"/>
        <rect x="110" y="0" width="32" height="12" rx="6" fill="#f59e0b"/>
        <text x="280" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#111827">19.8% Share</text>
      </g>
    </g>
  </g>
</svg>
