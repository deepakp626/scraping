<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#78350f" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>

  <g transform="translate(50, 60)" filter="url(#shadow)">
    <!-- Main container -->
    <rect width="400" height="360" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

    <!-- Clock and Time illustration -->
    <g transform="translate(50, 40)">
      <!-- Outer Circle -->
      <circle cx="70" cy="70" r="50" fill="none" stroke="#f1f5f9" stroke-width="8"/>
      <circle cx="70" cy="70" r="50" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="80"/>
      <!-- Clock Hands -->
      <line x1="70" y1="70" x2="70" y2="35" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="70" x2="95" y2="70" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="6" fill="#f59e0b"/>

      <!-- ETA Display Card -->
      <rect x="150" y="25" width="160" height="90" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="165" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#6b7280">MEDIAN DELIVERY ETA</text>
      <text x="165" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#111827">14.2 Min</text>
    </g>

    <!-- Fees spike comparison chart -->
    <g transform="translate(40, 180)">
      <text x="10" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#111827">Dynamic Delivery Fee Tracker</text>
      
      <!-- Graph container -->
      <rect x="10" y="35" width="320" height="110" rx="8" fill="#f9fafb" stroke="#f3f4f6"/>
      
      <!-- Graph grid lines -->
      <line x1="20" y1="70" x2="320" y2="70" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="20" y1="105" x2="320" y2="105" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="20" y1="130" x2="320" y2="130" stroke="#d1d5db" stroke-width="1.5"/>

      <!-- Axis tags -->
      <text x="325" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#9ca3af">$4.99</text>
      <text x="325" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#9ca3af">$1.99</text>
      
      <!-- Surge fee line (Red/Orange) -->
      <path d="M 30 115 L 80 110 L 130 60 L 180 50 L 230 120 L 280 110 L 310 80" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 30 115 L 80 110 L 130 60 L 180 50 L 230 120 L 280 110 L 310 80 L 310 130 L 30 130 Z" fill="#fee2e2" fill-opacity="0.4"/>
      
      <!-- Normal fee line (Grey) -->
      <path d="M 30 115 L 80 115 L 130 110 L 180 115 L 230 115 L 280 110 L 310 110" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- High surge point highlight -->
      <circle cx="180" cy="50" r="4" fill="#ef4444"/>
      <rect x="155" y="20" width="50" height="18" rx="4" fill="#ef4444"/>
      <text x="180" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">SURGE</text>
    </g>
  </g>
</svg>
