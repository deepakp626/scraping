<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>

  <g transform="translate(50, 60)" filter="url(#shadow)">
    <!-- Main container -->
    <rect width="400" height="360" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

    <!-- Key business metric card -->
    <g transform="translate(30, 30)">
      <rect width="340" height="110" rx="12" fill="url(#blueGrad)"/>
      <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#bae6fd" text-transform="uppercase">Revenue Saved from stock recovery</text>
      <text x="20" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff">$248,500 <tspan font-size="16" font-weight="normal" fill="#e0f2fe">/ mo</tspan></text>
      <!-- Small Sparkline inside card -->
      <path d="M 230 80 Q 250 60, 270 70 T 310 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="310" cy="40" r="4" fill="#ffffff"/>
    </g>

    <!-- Out of Stock reduction metric -->
    <g transform="translate(30, 170)">
      <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#111827">Dark Store Out-of-Stock Reduction</text>
      
      <!-- Progress circle & descriptive text -->
      <g transform="translate(0, 30)">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#f1f5f9" stroke-width="8"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#0284c7" stroke-width="8" stroke-dasharray="251" stroke-dashoffset="63"/>
        <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">-75%</text>
        
        <text x="110" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Lower Out-of-Stock Duration</text>
        <text x="110" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" width="220">By automatically triggering replenishment systems</text>
        <text x="110" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b" width="220">upon detecting micro-fulfillment gaps.</text>
      </g>
    </g>
  </g>
</svg>
