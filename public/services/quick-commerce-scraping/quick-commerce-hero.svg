<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f7ff"/>
      <stop offset="100%" stop-color="#f0ebff"/>
    </linearGradient>
    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="12" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="28" fill="url(#bgGrad)"/>

  <!-- Decorative Network Nodes in Background -->
  <g opacity="0.25">
    <circle cx="100" cy="100" r="40" fill="none" stroke="#a78bfa" stroke-dasharray="5 5" stroke-width="1.5"/>
    <circle cx="500" cy="350" r="60" fill="none" stroke="#a78bfa" stroke-dasharray="5 5" stroke-width="1.5"/>
    <line x1="50" y1="225" x2="550" y2="225" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="8 8"/>
    <!-- Floating particles -->
    <circle cx="120" cy="200" r="3" fill="#a78bfa"/>
    <circle cx="480" cy="120" r="4" fill="#ec4899"/>
    <circle cx="420" cy="280" r="2" fill="#8b5cf6"/>
  </g>

  <!-- Speed wind lines behind scooter -->
  <g opacity="0.65" stroke-linecap="round">
    <line x1="80" y1="220" x2="220" y2="220" stroke="#c084fc" stroke-width="4" stroke-dasharray="40 10 10 10"/>
    <line x1="50" y1="250" x2="180" y2="250" stroke="#f472b6" stroke-width="5" stroke-dasharray="20 15 5 15"/>
    <line x1="100" y1="280" x2="250" y2="280" stroke="#a78bfa" stroke-width="3" stroke-dasharray="30 10 20 10"/>
    <line x1="120" y1="180" x2="200" y2="180" stroke="#c084fc" stroke-width="2" stroke-dasharray="15 15"/>
    <line x1="40" y1="310" x2="160" y2="310" stroke="#f472b6" stroke-width="4" stroke-dasharray="50 10"/>
  </g>

  <!-- Main Scooter & Rider Group -->
  <g transform="translate(140, 100)" filter="url(#shadow)">
    
    <!-- Headlight Beam (Glow) -->
    <polygon points="270,170 390,140 390,220" fill="url(#glowGrad)"/>

    <!-- SCOOTER WHEELS -->
    <!-- Rear Wheel -->
    <circle cx="60" cy="220" r="32" fill="#1f2937"/>
    <circle cx="60" cy="220" r="20" fill="#9ca3af"/>
    <circle cx="60" cy="220" r="8" fill="#4b5563"/>
    <!-- Front Wheel -->
    <circle cx="260" cy="220" r="32" fill="#1f2937"/>
    <circle cx="260" cy="220" r="20" fill="#9ca3af"/>
    <circle cx="260" cy="220" r="8" fill="#4b5563"/>
    
    <!-- SCOOTER BODY -->
    <!-- Chassis / Floorboard -->
    <path d="M 60 220 L 100 220 Q 150 220, 160 190 L 175 130 Q 185 100, 240 100 L 260 220" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
    <!-- Main Frame / Fender Purple -->
    <path d="M 50 200 C 50 160, 100 160, 110 195 L 155 195 Q 170 195, 175 170 L 195 90 Q 200 70, 220 70 L 245 70 Q 255 70, 260 90 L 275 160 L 270 200 C 270 170, 250 170, 240 195 Z" fill="url(#scooterGrad)"/>
    
    <!-- Front Mudguard -->
    <path d="M 235 180 C 235 160, 280 160, 285 190" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Handlebars and Mirror -->
    <line x1="210" y1="70" x2="195" y2="40" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="35" r="8" fill="#4b5563" stroke="#ffffff" stroke-width="2"/>
    <line x1="210" y1="70" x2="230" y2="60" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>

    <!-- Headlight -->
    <circle cx="225" cy="78" r="8" fill="#fef08a" stroke="#4b5563" stroke-width="2"/>

    <!-- DELIVERY BOX (Magenta/Neon) -->
    <rect x="25" y="80" width="70" height="70" rx="10" fill="url(#boxGrad)"/>
    <!-- Box text label -->
    <rect x="35" y="110" width="50" height="12" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <text x="60" y="119" font-family="'Inter', sans-serif, system-ui" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">EXPRESS</text>
    <!-- Straps/Mounts -->
    <path d="M 95 100 L 115 110 M 95 130 L 115 125" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

    <!-- RIDER (Stylized Vector) -->
    <!-- Torso (leaning forward) -->
    <path d="M 115 155 Q 140 110, 180 110 L 210 110 L 195 160 Z" fill="#1e2937"/>
    <!-- Arm (reaching to handlebar) -->
    <path d="M 170 120 L 210 90 L 220 90" fill="none" stroke="#1e2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Leg -->
    <path d="M 125 155 L 145 195 L 165 195" fill="none" stroke="#1e2937" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Helmet (Neon Violet) -->
    <circle cx="180" cy="75" r="18" fill="#7c3aed"/>
    <!-- Helmet Visor (Black gloss) -->
    <path d="M 182 62 A 15 15 0 0 1 198 78 L 190 78 Z" fill="#0f172a"/>
  </g>

  <!-- FLOATING ELEMENTS (Representing groceries & delivery speed) -->
  <!-- Floating Grocery Bag -->
  <g transform="translate(420, 100)" filter="url(#shadow)">
    <!-- Bag body -->
    <path d="M 10 15 L 45 15 L 50 50 L 5 50 Z" fill="#fcd34d" rx="3"/>
    <!-- Bag Handles -->
    <path d="M 18 15 C 18 5, 37 5, 37 15" fill="none" stroke="#d97706" stroke-width="3"/>
    <!-- Leaf sticking out -->
    <path d="M 15 15 C 10 5, 25 0, 20 15 Z" fill="#10b981"/>
    <!-- Tomato floating nearby -->
    <circle cx="-15" cy="25" r="10" fill="#ef4444"/>
    <path d="M -15 15 Q -12 11, -15 9" fill="none" stroke="#15803d" stroke-width="2"/>
  </g>

  <!-- Speed Timer Badge ("10 MINS") -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="110" height="42" rx="12" fill="url(#orangeGrad)"/>
    <text x="55" y="26" font-family="'Inter', sans-serif, system-ui" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">⚡ 10 MINS</text>
  </g>

  <!-- Dynamic pricing tag floating -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <rect width="90" height="35" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="15" cy="17" r="3" fill="#10b981"/>
    <text x="26" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">LIVE PRICE</text>
  </g>

  <!-- Ground reflection shadow -->
  <ellipse cx="300" cy="340" rx="160" ry="12" fill="#000000" opacity="0.08"/>
</svg>
